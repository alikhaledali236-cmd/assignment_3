<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registration Form</title>
<style>
  :root { --ink:#1d2433; --muted:#5b6578; --line:#cfd6e4; --bg:#eef2f8; --card:#fff; --accent:#1f5fbf; --error:#b3261e; --ok:#1b7f4b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"Segoe UI", system-ui, sans-serif; padding:24px; }
  form { background:var(--card); width:100%; max-width:420px; padding:32px; border-radius:10px; border:1px solid var(--line); }
  h1 { margin:0 0 20px; font-size:1.5rem; }
  .field { margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; padding:10px 12px; font-size:1rem; border:1.5px solid var(--line); border-radius:6px; font-family:inherit; }
  input:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  input.invalid { border-color:var(--error); }
  input.valid { border-color:var(--ok); }
  .error { color:var(--error); font-size:.875rem; min-height:1.2em; margin:4px 0 0; }
  button { width:100%; padding:12px; font-size:1rem; font-weight:600; color:#fff; background:var(--accent); border:0; border-radius:6px; cursor:pointer; }
  button:hover { background:#174a96; }
  #success { display:none; margin-top:16px; padding:12px; border-radius:6px; background:#e3f4ea; color:var(--ok); font-weight:600; }
</style>
</head>
<body>
<form id="regForm" novalidate>
  <h1>Create an account</h1>

  <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" autocomplete="name">
    <p class="error" id="nameError"></p>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="text" id="email" autocomplete="email">
    <p class="error" id="emailError"></p>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password">
    <p class="error" id="passwordError"></p>
  </div>

  <div class="field">
    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" autocomplete="new-password">
    <p class="error" id="confirmError"></p>
  </div>

  <div class="field">
    <label for="age">Age</label>
    <input type="text" id="age" inputmode="numeric">
    <p class="error" id="ageError"></p>
  </div>

  <button type="submit">Register</button>
  <div id="success" role="status">Registration successful!</div>
</form>

<script>
  const form = document.getElementById("regForm");
  const fields = ["name", "email", "password", "confirm", "age"];

  // Each validator returns an error message, or "" if the value is fine.
  const validators = {
    name(v) {
      v = v.trim();
      if (v === "") return "Name is required.";
      if (v.length < 2) return "Name must be at least 2 characters.";
      return "";
    },
    email(v) {
      v = v.trim();
      if (v === "") return "Email is required.";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Enter a valid email like name@example.com.";
      return "";
    },
    password(v) {
      if (v === "") return "Password is required.";
      if (v.length < 8) return "Password must be at least 8 characters.";
      if (!/[A-Za-z]/.test(v) || !/\d/.test(v)) return "Password must include a letter and a number.";
      return "";
    },
    confirm(v) {
      if (v === "") return "Please confirm your password.";
      if (v !== document.getElementById("password").value) return "Passwords do not match.";
      return "";
    },
    age(v) {
      v = v.trim();
      if (v === "") return "Age is required.";
      if (!/^\d+$/.test(v)) return "Age must be a whole number.";
      const n = Number(v);
      if (n < 13 || n > 120) return "Age must be between 13 and 120.";
      return "";
    }
  };

  function validateField(id) {
    const input = document.getElementById(id);
    const msg = validators[id](input.value);
    document.getElementById(id + "Error").textContent = msg;
    input.classList.toggle("invalid", msg !== "");
    input.classList.toggle("valid", msg === "");
    return msg === "";
  }

  // Live feedback after the user leaves a field or edits it
  fields.forEach(id => {
    const input = document.getElementById(id);
    input.addEventListener("blur", () => validateField(id));
    input.addEventListener("input", () => {
      if (input.classList.contains("invalid")) validateField(id);
      if (id === "password" && document.getElementById("confirm").value) validateField("confirm");
    });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault(); // always stop the default send first
    const success = document.getElementById("success");
    success.style.display = "none";

    // Run every validator (no short-circuit) so all errors show at once
    const results = fields.map(validateField);
    const allValid = results.every(Boolean);

    if (!allValid) {
      document.querySelector("input.invalid").focus();
      return; // form is NOT submitted
    }
    success.style.display = "block";
    form.reset();
    fields.forEach(id => document.getElementById(id).classList.remove("valid"));
  });
</script>
</body>
</html>
